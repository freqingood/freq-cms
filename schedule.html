<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — thefreq.in</title>
<meta name="description" content="Book time with The Freq to talk through your project and get set up.">
<link rel="canonical" href="https://thefreq.in/schedule.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Schedule — thefreq.in">
<meta property="og:description" content="Book time with The Freq to talk through your project and get set up.">
<meta property="og:url" content="https://thefreq.in/schedule.html">
<meta property="og:site_name" content="thefreq.in">
<meta property="og:image" content="https://thefreq.in/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Schedule — thefreq.in">
<meta name="twitter:description" content="Book time with The Freq to talk through your project and get set up.">
<meta name="twitter:image" content="https://thefreq.in/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box }
:root { --pink:#F50CA0; --teal:#00CED1; --yellow:#F5E663; --bg:#050505; --card:#0c0c0c; --text:#f0eadf; --muted:rgba(240,234,223,.55); --dim:rgba(240,234,223,.14) }
html { background:var(--bg); -webkit-text-size-adjust:100% }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; line-height:1.6; overflow-wrap:break-word }
a { color:var(--teal); text-decoration:none }
a:hover { text-decoration:underline }
:focus-visible { outline:2px solid var(--pink); outline-offset:3px }
img { max-width:100%; height:auto }

header { padding:56px 44px 28px; border-bottom:.5px solid var(--dim) }
.logo { font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.05em; color:var(--muted); margin-bottom:18px; display:inline-block }
.crumb { font-size:12.5px; color:var(--muted); margin:14px 0 0 }
.crumb a { color:var(--teal) }
h1 { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(36px,5vw,56px); letter-spacing:-.01em }
h1 em { color:var(--pink); font-style:italic }
.sub { color:var(--muted); font-size:15px; margin-top:14px; max-width:560px }

main { max-width:840px; margin:0 auto; padding:44px 44px 100px }

.expect { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:32px }
.expect li { list-style:none; padding:9px 16px; background:var(--card); border:.5px solid var(--dim); border-radius:20px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted) }

.form-frame {
  background:var(--card);
  border:.5px solid var(--dim);
  border-radius:14px;
  overflow:hidden;
}
.form-frame iframe {
  display:block;
  width:100%;
  height:min(78vh, 1100px);
  min-height:520px;
  border:0;
  background:#fff;
}
.form-open {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 20px;
  border-top:.5px solid var(--dim);
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}

.pending {
  background:var(--card);
  border:.5px solid var(--dim);
  border-radius:14px;
  padding:40px 32px;
  text-align:center;
}
.pending h2 { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--yellow); margin-bottom:12px }
.pending p { color:var(--muted); font-size:14.5px; max-width:480px; margin:0 auto 18px }
.pending a { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase }

footer { padding:32px 44px 64px; color:rgba(240,234,223,.3); font-family:'Space Mono',monospace; font-size:12px; text-align:center }

@media (max-width:720px) {
  header { padding:34px 18px 22px }
  main   { padding:26px 18px 40px }
  footer { padding:26px 18px 44px }
  .form-frame iframe { height:82vh }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:.001ms !important; animation-duration:.001ms !important }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><img src="freq-logo.png" alt="The Freq" width="68" height="20" style="height:20px;width:auto;display:block"></a>
  <p class="crumb"><a href="https://thefreq.in/">thefreq.in</a> &rsaquo; Schedule</p>
  <h1>Let's find a <em>time.</em></h1>
  <p class="sub">Book a slot below and we'll take it from there. Prefer email first? Reach us through <a href="https://thefreq.in/about.html">the about page</a>.</p>
</header>
<main>
  <ul class="expect">
    <li>Takes 2 minutes</li>
    <li>No payment required</li>
    <li>Confirmation by email</li>
  </ul>

  <!--
    ── HOW TO GO LIVE ──────────────────────────────────────────
    Paste your Google Form's embed URL into FORM_URL below. Get it
    from the form: Send → the "<>" embed tab → copy the src="..."
    value out of the provided iframe snippet (looks like
    https://docs.google.com/forms/d/e/FORM_ID/viewform?embedded=true).

    Until FORM_URL is set, this page shows a "coming soon" state
    instead of a broken embed — safe to deploy right now.
  -->
  <div id="scheduleRoot"></div>
</main>
<footer>thefreq.in — booking</footer>
<script>
(function () {
  var FORM_URL = ''; // ← paste the Google Form embed URL here

  var root = document.getElementById('scheduleRoot');
  var isReal = /^https:\/\/docs\.google\.com\/forms\/.+\/viewform/.test(FORM_URL) ||
               /^https:\/\/forms\.gle\//.test(FORM_URL);

  if (isReal) {
    var openUrl = FORM_URL.replace(/\?.*$/, '');
    root.innerHTML =
      '<div class="form-frame">' +
        '<iframe src="' + FORM_URL + '" title="Schedule a session" loading="lazy">Loading…</iframe>' +
        '<div class="form-open"><span>Form not loading?</span>' +
          '<a href="' + openUrl + '" target="_blank" rel="noopener">Open in a new tab &rarr;</a>' +
        '</div>' +
      '</div>';
  } else {
    root.innerHTML =
      '<div class="pending">' +
        '<h2>Booking opens shortly</h2>' +
        '<p>The scheduling form is being set up. Check back soon, or reach out directly in the meantime.</p>' +
        '<a href="https://thefreq.in/about.html">Get in touch &rarr;</a>' +
      '</div>';
  }
})();
</script>
</body>
</html>
